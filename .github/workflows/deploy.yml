name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made with GITHUB_TOKEN (the nightly sync's commits) don't trigger push workflows,
  # so redeploy when the sync finishes.
  workflow_run:
    workflows: [Sync upstream lists]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Test
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=tvtidy --branch=main
